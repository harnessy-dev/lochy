name: release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      # A mismatch would publish v0.2.0 as an asset named lochy-0.1.0, and the
      # install path is a pinned asset URL, so it is not something to discover
      # afterwards.
      - name: Check the tag against the packaged version
        run: |
          packaged=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$packaged" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${packaged}" >&2
            exit 1
          fi

      # py3-none-any, so one build serves every platform and there is no
      # matrix here. The build is byte-reproducible; keep it that way.
      - run: uv build

      - name: Check the wheel installs and runs
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          test "$(/tmp/smoke/bin/lochy --version)" = "lochy ${GITHUB_REF_NAME#v}"

      # Both artifacts: the wheel is what `uv tool install` points at, the
      # sdist is what anyone building from source needs.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
